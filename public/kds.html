<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>廚房即時出單系統 (KDS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none">
  <!-- 頂部資訊列 -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shrink-0">
    <div class="flex items-center gap-4">
      <div class="w-10 h-10 bg-amber-500 rounded-xl flex items-center justify-center text-slate-950 font-black text-xl shadow">🍳</div>
      <div>
        <h1 class="text-xl font-black tracking-wide text-white">KDS 廚房即時出單螢幕</h1>
        <p class="text-xs text-slate-400">WebSocket 毫秒級即時接單 / 支援熟食吧檯分單與追加單標註</p>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700 text-xs font-medium">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span class="text-slate-300">雲端監聽中</span>
      </div>
      <span id="kdsClock" class="font-mono text-amber-400 text-lg font-bold">--:--:--</span>
    </div>
  </header>

  <main class="flex-1 p-6 overflow-x-auto flex gap-6 items-start" id="kdsOrdersContainer"></main>

  <script>
    setInterval(() => {
      document.getElementById('kdsClock').innerText = new Date().toLocaleTimeString('zh-TW');
    }, 1000);

    const ws = new WebSocket(`ws://${location.host}`);
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === 'ORDER_CREATED' || msg.type === 'KDS_UPDATED' || msg.type === 'TABLE_UPDATED') {
        playBeep();
        loadKdsOrders();
      }
    };

    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    async function loadKdsOrders() {
      const res = await fetch('/api/kds/orders');
      const orders = await res.json();
      const container = document.getElementById('kdsOrdersContainer');
      container.innerHTML = '';

      if (orders.length === 0) {
        container.innerHTML = `
          <div class="m-auto text-center py-24 text-slate-500">
            <div class="text-6xl mb-4">☕</div>
            <div class="text-xl font-bold text-slate-400">目前所有餐點皆已出完</div>
            <div class="text-xs text-slate-600 mt-2">前台一旦送單或加點，將會立即跳出並伴隨提示音</div>
          </div>
        `;
        return;
      }

      orders.forEach(ord => {
        const orderTime = new Date(ord.created_at).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
        const card = document.createElement('div');
        card.className = 'w-80 bg-slate-800 rounded-2xl border-2 border-slate-700 shadow-xl overflow-hidden flex flex-col shrink-0';

        let itemsHtml = ord.items.map(it => `
          <div class="p-3 bg-slate-850 hover:bg-slate-700/50 rounded-xl transition cursor-pointer border ${it.is_addon ? 'border-amber-500/60' : 'border-slate-700/50'} flex justify-between items-start ${it.item_status === 'DONE' ? 'opacity-35 line-through' : ''}" onclick="toggleItemStatus(${it.id}, '${it.item_status === 'DONE' ? 'PREPARING' : 'DONE'}')">
            <div>
              <div class="font-bold text-slate-100 text-sm">
                ${it.is_addon ? '<span class="text-[10px] bg-amber-500 text-slate-950 px-1 py-0.5 rounded font-black mr-1">追加</span>' : ''}
                ${it.product_name} <span class="text-amber-400 font-black">x ${it.quantity}</span>
              </div>
              ${it.modifiers_text ? '<div class="text-xs text-amber-300 mt-0.5 font-medium">' + it.modifiers_text + '</div>' : ''}
            </div>
            <span class="text-[10px] px-1.5 py-0.5 rounded font-mono ${it.station === 'KITCHEN' ? 'bg-orange-950 text-orange-300' : 'bg-cyan-950 text-cyan-300'}">
              ${it.station === 'KITCHEN' ? '熟食' : '吧檯'}
            </span>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="p-4 bg-slate-750 border-b border-slate-700 flex justify-between items-center">
            <div>
              <div class="text-xl font-black text-amber-400">${ord.table_name || '外帶取餐'}</div>
              <div class="text-xs font-mono text-slate-400">單號: ${ord.order_number}</div>
            </div>
            <div class="text-right">
              <div class="text-sm font-bold text-white">${orderTime}</div>
              <span class="text-[10px] bg-emerald-900 text-emerald-300 px-2 py-0.5 rounded font-bold">製作中</span>
            </div>
          </div>
          <div class="p-3 space-y-2 flex-1 overflow-y-auto max-h-[60vh]">
            ${itemsHtml}
          </div>
          <div class="p-3 bg-slate-800 border-t border-slate-700">
            <button onclick="completeOrder(${ord.id})" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-sm shadow transition">
              ✓ 全單製作完成 (出單)
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function toggleItemStatus(itemId, newStatus) {
      await fetch('/api/kds/update-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: itemId, status: newStatus })
      });
      loadKdsOrders();
    }

    async function completeOrder(orderId) {
      await fetch('/api/kds/update-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order_id: orderId, status: 'COMPLETED' })
      });
      loadKdsOrders();
    }

    loadKdsOrders();
  </script>
</body>
</html>
