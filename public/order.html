<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小森食光坊 · 線上手機點餐</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-28">

  <!-- 頂部店名與桌號 -->
  <header class="bg-emerald-600 text-white p-4 sticky top-0 z-30 shadow-md">
    <div class="flex justify-between items-center max-w-lg mx-auto">
      <div>
        <h1 class="text-lg font-bold">小森食光坊</h1>
        <p class="text-xs text-emerald-100" id="tableDisplay">載入桌位中...</p>
      </div>
      <span class="bg-emerald-700 text-xs px-2.5 py-1 rounded-full font-medium">手機自助點餐</span>
    </div>
  </header>

  <!-- 分類快捷滑動列 -->
  <div class="bg-white border-b sticky top-[60px] z-20 shadow-sm overflow-x-auto whitespace-nowrap px-3 py-2.5 flex gap-2 max-w-lg mx-auto" id="categoryNav">
    <!-- 動態分類按鈕 -->
  </div>

  <!-- 餐點清單 -->
  <main class="max-w-lg mx-auto p-4 space-y-6" id="menuContainer">
    <p class="text-center text-gray-400 py-10">菜單載入中...</p>
  </main>

  <!-- 底部購物車懸浮列 -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 z-40 shadow-lg">
    <div class="max-w-lg mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="relative bg-emerald-100 text-emerald-700 p-2.5 rounded-full">
          🛒
          <span id="cartCount" class="absolute -top-1 -right-1 bg-rose-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
        </div>
        <div>
          <p class="text-xs text-gray-500">預估合計</p>
          <p class="text-lg font-bold text-gray-900" id="cartTotal">NT$ 0</p>
        </div>
      </div>
      <button onclick="submitOrder()" id="submitBtn" class="bg-emerald-600 active:bg-emerald-700 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow">
        確認送單
      </button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const currentTable = urlParams.get('table') || '內用';
    document.getElementById('tableDisplay').innerText = `用餐位置：${currentTable}`;

    let fullMenu = [];
    let cart = [];

    // 載入伺服器菜單
    async function initMenu() {
      try {
        const res = await fetch('/api/data');
        const data = await res.json();
        fullMenu = data.menu || [];
        renderCategories(data.categories || []);
        renderMenu(fullMenu);
      } catch (e) {
        document.getElementById('menuContainer').innerHTML = '<p class="text-center text-rose-500 py-10">連線失敗，請檢查網路</p>';
      }
    }

    function renderCategories(categories) {
      const nav = document.getElementById('categoryNav');
      nav.innerHTML = categories.map((cat, i) => `
        <a href="#cat-${i}" class="px-3.5 py-1 text-xs rounded-full font-medium bg-gray-100 text-gray-600 active:bg-emerald-500 active:text-white">
          ${cat}
        </a>
      `).join('');
    }

    function renderMenu(items) {
      const container = document.getElementById('menuContainer');
      const groups = {};
      items.forEach(item => {
        if (!groups[item.category]) groups[item.category] = [];
        groups[item.category].push(item);
      });

      let html = '';
      let catIdx = 0;
      for (const [catName, catItems] of Object.entries(groups)) {
        html += `<div id="cat-${catIdx++}" class="scroll-mt-28">
          <h2 class="font-bold text-gray-800 text-base mb-2 border-l-4 border-emerald-500 pl-2">${catName}</h2>
          <div class="space-y-2.5">
            ${catItems.map(item => `
              <div class="bg-white p-3.5 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
                <div>
                  <h3 class="font-bold text-gray-900 text-sm">${item.name}</h3>
                  <p class="text-xs text-gray-400 mt-0.5">${item.spec ? item.spec.join(' / ') : ''}</p>
                  <p class="text-emerald-600 font-bold text-sm mt-1">NT$ ${item.price}</p>
                </div>
                <button onclick="addToCart('${item.id}')" class="bg-emerald-50 text-emerald-700 font-bold px-3.5 py-1.5 rounded-lg text-xs active:bg-emerald-600 active:text-white transition">
                  ＋ 加入
                </button>
              </div>
            `).join('')}
          </div>
        </div>`;
      }
      container.innerHTML = html;
    }

    function addToCart(itemId) {
      const item = fullMenu.find(m => m.id === itemId);
      if (!item) return;
      const exist = cart.find(c => c.id === itemId);
      if (exist) exist.qty += 1;
      else cart.push({ ...item, qty: 1 });
      updateCartUI();
    }

    function updateCartUI() {
      const count = cart.reduce((sum, i) => sum + i.qty, 0);
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      document.getElementById('cartCount').innerText = count;
      document.getElementById('cartTotal').innerText = `NT$ ${total}`;
    }

    async function submitOrder() {
      if (cart.length === 0) return alert('購物車內目前沒有餐點喔！');
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
      const orderPayload = {
        table: currentTable,
        items: cart,
        totalAmount: total,
        note: '顧客手機線上點餐'
      };

      const btn = document.getElementById('submitBtn');
      btn.innerText = '送單中...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(orderPayload)
        });
        const result = await res.json();
        if (result.success) {
          alert(`點餐成功！訂單編號：${result.order.id}，店家正為您準備餐點。`);
          cart = [];
          updateCartUI();
        } else {
          alert('送單失敗，請稍後再試');
        }
      } catch (err) {
        alert('網路異常，送單失敗');
      } finally {
        btn.innerText = '確認送單';
        btn.disabled = false;
      }
    }

    initMenu();
  </script>
</body>
</html>
